<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Life Admin — Topic Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A0A0F; color: #E0E0E8; line-height: 1.5; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 6px; color: #F0F0F5; }
  .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  .login { padding: 30px; background: #111120; border-radius: 12px; text-align: center; }
  .login input { width: 100%; padding: 14px; background: #0A0A0F; border: 1px solid #333; border-radius: 8px; color: #E0E0E8; font-size: 16px; margin-bottom: 12px; }
  button { background: #3EA758; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.reject { background: #c0392b; }
  button:disabled { opacity: 0.4; cursor: wait; }
  .card { background: #111120; border: 1px solid #3EA75820; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .card .title { font-size: 17px; font-weight: 700; color: #F0F0F5; margin-bottom: 8px; }
  .card .meta { font-size: 12px; color: #666; margin-bottom: 10px; }
  .card .body { font-size: 14px; color: #AAA; margin-bottom: 14px; }
  .card .btns { display: flex; gap: 10px; }
  .card .btns button { flex: 1; }
  .empty { text-align: center; padding: 50px 20px; color: #666; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3EA758; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
  .logout { float: right; background: transparent; color: #888; font-size: 12px; padding: 4px 10px; }
</style>
</head>
<body>
<div class="container">
  <div id="loginView" class="login" style="display:none;">
    <h1>Topic Control</h1>
    <div class="sub">Enter admin pin</div>
    <input id="pinInput" type="password" placeholder="Pin" autocomplete="off"/>
    <button onclick="login()">Unlock</button>
  </div>

  <div id="appView" style="display:none;">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>Topic Control</h1>
    <div class="sub">Approve topics to send to script generation</div>
    <div id="list"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://roamiiqvmveykqdlwsav.supabase.co';
const ANON_KEY = 'sb_publishable_OA7isbZYFEyRdwjsZqgozQ_GOxGztS9';
const FUNCTION = SUPABASE_URL + '/functions/v1/smooth-function';

let pin = sessionStorage.getItem('admin_pin');
if (pin) showApp(); else document.getElementById('loginView').style.display = 'block';

function login() {
  const v = document.getElementById('pinInput').value.trim();
  if (!v) return;
  pin = v;
  sessionStorage.setItem('admin_pin', pin);
  showApp();
}
function logout() {
  sessionStorage.removeItem('admin_pin');
  pin = null;
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}
async function showApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  await loadTopics();
}
async function loadTopics() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch(FUNCTION + '?action=list', { headers: { 'x-admin-pin': pin, 'Authorization': 'Bearer ' + ANON_KEY, 'apikey': ANON_KEY } });
    if (r.status === 401) { logout(); toast('Wrong pin'); return; }
    const data = await r.json();
    render(data.topics || []);
  } catch (e) {
    list.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}
function render(topics) {
  const list = document.getElementById('list');
  if (!topics.length) { list.innerHTML = '<div class="empty">No pending topics. Check back at 8am.</div>'; return; }
  list.innerHTML = topics.map(t => `
    <div class="card" data-id="${t.id}">
      <div class="title">${escape(t.title)}</div>
      <div class="meta">Score ${t.viral_score || '—'} · ${escape(t.trend_source || '')}</div>
      <div class="body">${escape(t.angle || '')}</div>
      ${t.hook_idea ? `<div class="body"><strong>Hook:</strong> ${escape(t.hook_idea)}</div>` : ''}
      <div class="btns">
        <button onclick="act('${t.id}','approve',this)">Approve</button>
        <button class="reject" onclick="act('${t.id}','reject',this)">Reject</button>
      </div>
    </div>
  `).join('');
}
async function act(id, action, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await fetch(FUNCTION, {
      method: 'POST',
      headers: { 'x-admin-pin': pin, 'Authorization': 'Bearer ' + ANON_KEY, 'apikey': ANON_KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ id, action })
    });
    if (r.ok) {
      document.querySelector(`[data-id="${id}"]`).remove();
      toast(action === 'approve' ? 'Approved' : 'Rejected');
      if (!document.querySelectorAll('.card').length) render([]);
    } else {
      toast('Failed');
      btn.disabled = false;
      btn.textContent = action === 'approve' ? 'Approve' : 'Reject';
    }
  } catch (e) {
    toast('Error');
    btn.disabled = false;
  }
}
function escape(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
